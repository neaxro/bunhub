services:
  backend:
    container_name: bunhub_api
    build:
      context: backend/
      dockerfile: Dockerfile
    environment:
      LOGLEVEL: info
      ROOTPATH: "/"
      APP_ENVIRONMENT: test
      POSTGRES_USER: bunhub_user
      POSTGRES_PASSWORD: securepassword
      POSTGRES_HOST: database
      POSTGRES_DATABASE: bunhub
      POSTGRES_PORT: 5432
    ports:
      - 8000:8000
    depends_on:
      database:
        condition: service_healthy

  database:
    container_name: bunhub_db
    image: postgres:18.3
    shm_size: 128mb
    environment:
      POSTGRES_USER: bunhub_user
      POSTGRES_PASSWORD: securepassword
      POSTGRES_DB: bunhub
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bunhub_user -d bunhub"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - 5432:5432
    volumes:
    - ./database:/docker-entrypoint-initdb.d
